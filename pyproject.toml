[project]
name = "melty-rl"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numba>=0.68.1",
    "numpy>=2.5.4",
    "pygame-ce>=2.5.8",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# src/ is imported as a package from the repo root, the same way `python -m
# src.main` resolves it.
pythonpath = ["."]
testpaths = ["tests"]
